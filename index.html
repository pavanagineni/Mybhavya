<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #181204 0%, #080601 60%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Gold Shimmer Canvas */
    #sparkle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Center Stage */
    .brand-container {
      position: relative;
      display: inline-block;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    /* Animated Shiny 24krt.com Text */
    .gold-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 14vw, 8.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      
      /* Multi-layered metallic gold gradient */
      background: linear-gradient(
        110deg,
        #b8860b 0%,
        #ffd700 18%,
        #fff9d2 30%,
        #ffffff 38%,
        #ffd700 48%,
        #d49000 65%,
        #ffd700 85%,
        #b8860b 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Deep gold volumetric glow */
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.45));
      animation: goldGleam 4.5s linear infinite;
      will-change: background-position, filter;
    }

    @keyframes goldGleam {
      0% {
        background-position: 150% 0;
        filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.35));
      }
      50% {
        filter: drop-shadow(0 0 55px rgba(255, 235, 120, 0.85));
      }
      100% {
        background-position: -100% 0;
        filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.35));
      }
    }

    /* Cross Sparkle Glints */
    .glint {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
      opacity: 0;
    }
    .glint::before, .glint::after {
      content: '';
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffd700, 0 0 25px #ffffff;
    }
    .glint::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }
    .glint::after {
      left: 50%;
      top: 0;
      height: 100%;
      width: 2px;
      transform: translateX(-50%);
    }

    .glint-1 {
      top: 15%;
      left: 18%;
      animation: flashGlint 4.5s ease-in-out infinite;
      animation-delay: 1.1s;
    }
    .glint-2 {
      top: 30%;
      right: 22%;
      animation: flashGlint 4.5s ease-in-out infinite;
      animation-delay: 2.6s;
    }
    .glint-3 {
      bottom: 25%;
      left: 52%;
      animation: flashGlint 4.5s ease-in-out infinite;
      animation-delay: 3.8s;
    }

    @keyframes flashGlint {
      0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      15% { transform: scale(1.4) rotate(45deg); opacity: 1; }
      30% { transform: scale(0) rotate(90deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="sparkle-canvas"></canvas>

  <div class="brand-container">
    <div class="glint glint-1"></div>
    <div class="glint glint-2"></div>
    <div class="glint glint-3"></div>
    <h1 class="gold-title">24krt.com</h1>
  </div>

  <script>
    // Lightweight Gold Dust Canvas (Pure 60 FPS)
    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 2 + 0.6,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(Math.random() * 0.6 + 0.2), // Rising shimmer dust
      alpha: Math.random() * 0.7 + 0.3
    }));

    function loop() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.y < -10) {
          p.y = h + 10;
          p.x = Math.random() * w;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
