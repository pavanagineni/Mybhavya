<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24KRT.com - Gold Digger</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <canvas id="bg"></canvas>

  <!-- Header -->
  <header>
    <h1 class="logo">
      <span>24</span>KRT.com
    </h1>

    <div class="visitors">
      👁 Visitors:
      <span id="visitorCount">247</span>
    </div>
  </header>

  <!-- Main -->
  <main>

    <div class="left">

      <div class="tag">
        THE GOLD RUSH IS ON
      </div>

      <h2>
        DIG <br>
        <span>DEEPER</span>
      </h2>

      <p>
        Every strike could uncover something valuable.
      </p>

      <button id="digButton">
        ⛏ DIG FOR GOLD
      </button>

      <div class="stats">
        <div>
          <b id="gold">0</b>
          <small>GOLD</small>
        </div>

        <div>
          <b id="depth">0m</b>
          <small>DEPTH</small>
        </div>

        <div>
          <b id="strikes">0</b>
          <small>STRIKES</small>
        </div>
      </div>

    </div>

    <div class="right">

      <div class="mine">

        <div class="miner">
          <div class="helmet"></div>
          <div class="head"></div>
          <div class="body"></div>

          <div class="arm"></div>

          <div class="pickaxe"></div>

          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

      </div>

    </div>

  </main>

  <script src="game.js"></script>

</body>
</html>
