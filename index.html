<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>24krt.com - Special Birthday Reveal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(ellipse at 50% 35%, #1f1406 0%, #0d0a04 45%, #050402 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      perspective: 1200px;
    }

    .font-luxury {
      font-family: 'Cinzel', serif;
    }

    /* Shimmering Metallic Gold Gradients */
    .gold-gradient-text {
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 25%, #ffae19 50%, #ffffff 75%, #d4af37 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldSheen 4s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.45));
    }

    @keyframes goldSheen {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Subtle ambient floating particle dust */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, rgba(212, 175, 55, 0.05) 50%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    /* 3D Diorama Stage Setup */
    .diorama-stage {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* 3D Present Gift Box */
    .gift-cube {
      width: 110px;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .gift-face {
      position: absolute;
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #7c1d34 0%, #4a0917 100%);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Golden ribbon crossing */
    .gift-face::before, .gift-face::after {
      content: '';
      position: absolute;
      background: linear-gradient(90deg, #d4af37, #ffe57f, #b8860b);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    .gift-face::before {
      width: 22px;
      height: 100%;
    }
    .gift-face::after {
      height: 22px;
      width: 100%;
    }

    .face-front  { transform: rotateY(0deg) translateZ(55px); }
    .face-back   { transform: rotateY(180deg) translateZ(55px); }
    .face-right  { transform: rotateY(90deg) translateZ(55px); }
    .face-left   { transform: rotateY(-90deg) translateZ(55px); }
    .face-top    { transform: rotateX(90deg) translateZ(55px); background: #91223d; }
    .face-bottom { transform: rotateX(-90deg) translateZ(55px); }

    /* Animated floating box wobbler */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotateX(12deg) rotateY(15deg); }
      50% { transform: translateY(-10px) rotateX(16deg) rotateY(20deg); }
    }

    .floating-box {
      animation: gentleFloat 3s ease-in-out infinite;
    }

    /* Gift Lid Ejection */
    .lid-open .face-top {
      animation: popLid 1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes popLid {
      0% { transform: rotateX(90deg) translateZ(55px); opacity: 1; }
      40% { transform: rotateX(90deg) translateZ(180px) rotateZ(35deg) scale(1.15); opacity: 0.9; }
      100% { transform: rotateX(120deg) translateZ(320px) translateY(-140px) rotateZ(120deg) scale(0.4); opacity: 0; }
    }

    /* Exploding Rays of Golden Light */
    .light-beam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 240px;
      background: linear-gradient(to top, rgba(255, 215, 0, 0.9), transparent);
      transform-origin: bottom center;
      pointer-events: none;
      opacity: 0;
      filter: blur(1px);
    }

    .revealed .light-beam {
      animation: beamBurst 1.8s ease-out forwards;
    }

    @keyframes beamBurst {
      0% { opacity: 0; transform: translate(-50%, -100%) scaleY(0.2) rotate(var(--angle)); }
      30% { opacity: 1; transform: translate(-50%, -100%) scaleY(1.3) rotate(var(--angle)); }
      100% { opacity: 0; transform: translate(-50%, -100%) scaleY(1.6) rotate(var(--angle)); }
    }

    /* 24krt.com Ascending Reveal */
    .reveal-title-container {
      transform: translateY(60px) scale(0.3);
      opacity: 0;
      transition: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .reveal-title-container.active {
      transform: translateY(0px) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Construction Hazard Progress Ribbon */
    .hazard-stripe {
      background: repeating-linear-gradient(
        -45deg,
        #ffd700,
        #ffd700 12px,
        #1e1403 12px,
        #1e1403 24px
      );
      background-size: 48px 100%;
      animation: stripeScroll 1.2s linear infinite;
    }

    @keyframes stripeScroll {
      0% { background-position: 0 0; }
      100% { background-position: 48px 0; }
    }

    /* Pulsing Tap Badge */
    @keyframes pulseTap {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
      50% { transform: scale(1.06); box-shadow: 0 0 28px rgba(255, 215, 0, 0.85); }
    }

    .pulse-action {
      animation: pulseTap 1.8s ease-in-out infinite;
    }

    /* Canvas for Confetti & Magic Particles */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>

  <footer class="w-full max-w-md flex flex-col items-center gap-2.5 z-20 pb-2">
    <div class="flex items-center gap-3">
      <button id="btnMainAction" onclick="handlePresentClick()" class="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 text-black font-bold text-sm tracking-wide shadow-[0_0_25px_rgba(255,215,0,0.4)] hover:brightness-110 active:scale-95 transition-all flex items-center gap-2">
        <span id="btnIcon">🎁</span>
        <span id="btnText">Open Birthday Present</span>
      </button>

      <button id="btnReplay" onclick="resetGift()" class="hidden px-4 py-2.5 rounded-2xl bg-neutral-900/80 border border-neutral-700/80 text-amber-200 text-xs font-semibold hover:border-amber-400 transition-all flex items-center gap-1.5 active:scale-95">
        <span>🔄</span> Replay
      </button>

      <button id="btnSoundToggle" onclick="toggleMute()" class="px-3.5 py-2.5 rounded-2xl bg-neutral-900/80 border border-neutral-700/80 text-neutral-300 text-xs hover:border-amber-400 transition-all">
        <span id="muteIcon">🔊</span>
      </button>
    </div>

    <!-- Security & Status Info -->
    <div class="flex items-center gap-3 text-[11px] text-neutral-500">
      <span>🔒 Enforced SSL (HTTPS)</span>
      <span>•</span>
      <span>24krt.com Hosted on GitHub Pages</span>
    </div>
  </footer>

  <!-- Audio Synthesizer & Particle Systems Engine -->
  <script>
    let isOpened = false;
    let isMuted = false;
    let audioCtx = null;

    // 1. Web Audio Synthesizer for High-End Birthday Chimes & Celebration Bursts
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playCelebrationFanfare() {
      if (isMuted) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Sparkle Musical Chime Scale: C5, E5, G5, B5, C6, E6
        const frequencies = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51, 1567.98];

        frequencies.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);

          gain.gain.setValueAtTime(0, now + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.28, now + idx * 0.1 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 1.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 1.3);
        });

        // Warm Golden Bass Swell
        const bassOsc = ctx.createOscillator();
        const bassGain = ctx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(130.81, now); // C3
        bassOsc.frequency.exponentialRampToValueAtTime(261.63, now + 0.8); // C4

        bassGain.gain.setValueAtTime(0, now);
        bassGain.gain.linearRampToValueAtTime(0.35, now + 0.2);
        bassGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

        bassOsc.connect(bassGain);
        bassGain.connect(ctx.destination);

        bassOsc.start(now);
        bassOsc.stop(now + 2.6);

      } catch (err) {
        console.warn('Audio playback prevented by browser policy:', err);
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteIcon').textContent = isMuted ? '🔇' : '🔊';
    }

    // 2. Build Radiant Golden Light Beams around Present
    function initLightBeams() {
      const container = document.getElementById('lightRays');
      container.innerHTML = '';
      const rayCount = 18;
      for (let i = 0; i < rayCount; i++) {
        const ray = document.createElement('div');
        ray.className = 'light-beam';
        const angle = (360 / rayCount) * i;
        ray.style.setProperty('--angle', `${angle}deg`);
        ray.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
        container.appendChild(ray);
      }
    }

    // 3. High-Performance Canvas Confetti & Golden Sparkle Particle System
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class ConfettiParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const velocity = 5 + Math.random() * 11;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity - (Math.random() * 5 + 3);
        this.gravity = 0.22;
        this.friction = 0.96;

        this.size = Math.random() * 8 + 4;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 14;

        // Birthday & 24K Luxury Palette (Gold, Purple, Warm Ivory, Magenta)
        const colors = ['#ffd700', '#f59e0b', '#facc15', '#a855f7', '#ec4899', '#ffffff', '#e9d5ff'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 1;
        this.decay = Math.random() * 0.008 + 0.005;
        this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
      }

      draw(context) {
        if (this.alpha <= 0) return;
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.translate(this.x, this.y);
        context.rotate((this.rotation * Math.PI) / 180);
        context.fillStyle = this.color;

        if (this.shape === 'rect') {
          context.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        } else {
          context.beginPath();
          context.arc(0, 0, this.size * 0.45, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }
    }

    function spawnConfettiBlast(originX, originY) {
      for (let i = 0; i < 180; i++) {
        particles.push(new ConfettiParticle(originX, originY));
      }
      if (!animationFrameId) {
        renderParticles();
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      if (particles.length > 0) {
        animationFrameId = requestAnimationFrame(renderParticles);
      } else {
        animationFrameId = null;
      }
    }

    // 4. Main Event: Present Opening Trigger
    function handlePresentClick() {
      if (isOpened) return;
      isOpened = true;

      // Play Sound
      playCelebrationFanfare();

      const cube = document.getElementById('giftCube');
      const tapBadge = document.getElementById('tapMeBadge');
      const lightRays = document.getElementById('lightRays');
      const revealTarget = document.getElementById('revealTarget');
      const btnMain = document.getElementById('btnMainAction');
      const btnReplay = document.getElementById('btnReplay');

      // Pop the Lid off
      cube.classList.add('lid-open');
      cube.classList.remove('floating-box');
      tapBadge.style.opacity = '0';
      tapBadge.style.pointerEvents = 'none';

      // Golden Burst Light Rays
      lightRays.parentElement.classList.add('revealed');

      // Get origin position of the box on screen for particle blast
      const rect = cube.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      spawnConfettiBlast(originX, originY);

      // Subsequent secondary sparkle pops
      setTimeout(() => spawnConfettiBlast(originX - 60, originY - 40), 280);
      setTimeout(() => spawnConfettiBlast(originX + 60, originY - 40), 550);

      // Reveal 24krt.com Title
      setTimeout(() => {
        revealTarget.classList.add('active');
        revealTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 400);

      // Update footer controls
      btnMain.classList.add('hidden');
      btnReplay.classList.remove('hidden');
    }

    // 5. Replay / Reset Action
    function resetGift() {
      isOpened = false;
      const cube = document.getElementById('giftCube');
      const tapBadge = document.getElementById('tapMeBadge');
      const lightRays = document.getElementById('lightRays');
      const revealTarget = document.getElementById('revealTarget');
      const btnMain = document.getElementById('btnMainAction');
      const btnReplay = document.getElementById('btnReplay');

      revealTarget.classList.remove('active');
      cube.classList.remove('lid-open');
      cube.classList.add('floating-box');
      lightRays.parentElement.classList.remove('revealed');

      tapBadge.style.opacity = '1';
      tapBadge.style.pointerEvents = 'auto';

      btnMain.classList.remove('hidden');
      btnReplay.classList.add('hidden');
    }

    // Bind Direct Tap on Gift Box Cube
    document.getElementById('giftContainer').addEventListener('click', () => {
      handlePresentClick();
    });

    // Initialize light rays on page load
    window.addEventListener('load', () => {
      initLightBeams();

      // Gentle auto-trigger after 3.8 seconds if user hasn't clicked yet
      setTimeout(() => {
        if (!isOpened) {
          handlePresentClick();
        }
      }, 3800);
    });
  </script>
</body>
</html>
