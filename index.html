<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24krt.com - Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at center, #1a1600 0%, #080808 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Glowing Construction Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #ffd700;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .badge span {
      display: inline-block;
      animation: spin 3s linear infinite;
    }

    /* Animated Gold Domain Title */
    .domain-title {
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(120deg, #ffd700 0%, #fff3a8 30%, #d4af37 60%, #fff 80%, #ffd700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 12px;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #e2e8f0;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .description {
      color: #94a3b8;
      font-size: 15px;
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Moving Hazard Striped Bar */
    .hazard-bar {
      width: 280px;
      max-width: 85%;
      height: 12px;
      border-radius: 12px;
      background: repeating-linear-gradient(
        -45deg,
        #ffd700,
        #ffd700 14px,
        #222222 14px,
        #222222 28px
      );
      background-size: 56px 12px;
      animation: slideStripes 1.2s linear infinite;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
      margin-bottom: 36px;
    }

    /* Real-Time Live Views Container */
    .views-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 16px;
      padding: 12px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .views-label {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .views-badge img {
      display: block;
      height: 24px;
      border-radius: 4px;
    }

    /* Animations */
    @keyframes shine {
      to { background-position: 200% center; }
    }
    @keyframes slideStripes {
      0% { background-position: 0 0; }
      100% { background-position: 56px 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="badge">
    <span>⚙️</span> Under Construction
  </div>

  <h1 class="domain-title">24krt.com</h1>

  <div class="subtitle">Something exciting is coming soon</div>

  <p class="description">
    We are currently crafting a brand-new experience. Stay tuned for the launch!
  </p>

  <div class="hazard-bar"></div>

  <!-- Real-Time Live Views Counter -->
  <div class="views-card">
    <div class="views-label">
      <span>👁️</span> Total Visitors
    </div>
    <div class="views-badge">
      <img src="https://countapi.mileshilliard.com/api/v1/hit/24krt_official_visitors/shield?text=Visits&bgcolor=ffd700&textcolor=000000" alt="Live Views Count">
    </div>
  </div>
</body>
</html>
