<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', monospace;
    }
    .text-scramble {
      font-size: 1.15rem;
      letter-spacing: 0.38em;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.45);
      white-space: nowrap;
      padding: 10px;
      font-variant-numeric: tabular-nums;
    }
    .dim {
      color: #997a15;
      text-shadow: none;
    }
  </style>
</head>
<body>

  <div class="text-scramble" id="matrix-text">24krt.com</div>

  <script>
    const target = '24krt.com';
    const glyphs = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%&*';
    const el = document.getElementById('matrix-text');

    let current = target.split('');
    let resolvingIndex = 0;
    let cycles = 0;

    function scrambleStep() {
      // Build string with slow Matrix resolving effect
      let html = '';
      for (let i = 0; i < target.length; i++) {
        if (i < resolvingIndex) {
          html += target[i];
        } else if (i === resolvingIndex) {
          const randChar = glyphs[Math.floor(Math.random() * glyphs.length)];
          html += `<span class="dim">${randChar}</span>`;
        } else {
          const randChar = glyphs[Math.floor(Math.random() * glyphs.length)];
          html += `<span class="dim">${randChar}</span>`;
        }
      }
      el.innerHTML = html;

      cycles++;
      if (cycles > 4) {
        cycles = 0;
        resolvingIndex++;
      }

      if (resolvingIndex > target.length) {
        // Hold resolved text cleanly for 3.5 seconds, then restart loop
        setTimeout(() => {
          resolvingIndex = 0;
          cycles = 0;
          scrambleStep();
        }, 3500);
      } else {
        // Slow step speed (130ms per shift)
        setTimeout(scrambleStep, 130);
      }
    }

    scrambleStep();
  </script>
</body>
</html>
