<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24krt.com - Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at center, #1a1600 0%, #080808 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    /* Glowing Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #ffd700;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .badge span {
      display: inline-block;
      animation: spin 3s linear infinite;
    }

    /* Animated Gold Domain Name */
    .domain-title {
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(120deg, #ffd700 0%, #fff3a8 30%, #d4af37 60%, #fff 80%, #ffd700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 12px;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #e2e8f0;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .description {
      color: #94a3b8;
      font-size: 15px;
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Moving Hazard Striped Bar */
    .hazard-bar {
      width: 280px;
      max-width: 85%;
      height: 12px;
      border-radius: 12px;
      background: repeating-linear-gradient(
        -45deg,
        #ffd700,
        #ffd700 14px,
        #222222 14px,
        #222222 28px
      );
      background-size: 56px 12px;
      animation: slideStripes 1.2s linear infinite;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
      margin-bottom: 28px;
    }

    /* Send Message Button / Tab */
    .msg-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffd700;
      color: #000000;
      border: none;
      padding: 12px 26px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .msg-btn:hover {
      transform: scale(1.05);
      background: #ffea75;
    }

    /* Form Container (Modal / Hidden by Default) */
    .form-wrapper {
      display: none;
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      margin-top: 20px;
      text-align: left;
    }

    .form-wrapper h3 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #ffd700;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: #ffd700;
    }

    .form-submit-btn {
      width: 100%;
      background: #ffd700;
      color: #000;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Keyframes */
    @keyframes shine {
      to { background-position: 200% center; }
    }
    @keyframes slideStripes {
      0% { background-position: 0 0; }
      100% { background-position: 56px 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="badge">
    <span>⚙️</span> Under Construction
  </div>

  <h1 class="domain-title">24krt.com</h1>

  <div class="subtitle">Something exciting is coming soon</div>

  <p class="description">
    We are currently crafting a brand-new experience. Stay tuned for the launch!
  </p>

  <div class="hazard-bar"></div>

  <!-- Send Message Toggle Button -->
  <button class="msg-btn" onclick="toggleForm()">✉️ Send Message</button>

  <!-- Message Form -->
  <div class="form-wrapper" id="contactForm">
    <h3>Drop us a note</h3>
    <form action="https://formspree.io/f/pavannagineni@yahoo.com" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="_replyto" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit" class="form-submit-btn">Submit Message</button>
    </form>
  </div>

  <script>
    function toggleForm() {
      const form = document.getElementById('contactForm');
      if (form.style.display === 'block') {
        form.style.display = 'none';
      } else {
        form.style.display = 'block';
        form.scrollIntoView({ behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
