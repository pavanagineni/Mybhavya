<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(ellipse at 50% 25%, #181203 0%, #0a0701 60%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      font-family: 'Montserrat', sans-serif;
    }

    /* Ambient Mining Dust & Glitter Canvas */
    #mine-fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Branding: 24krt.com */
    header {
      padding-top: 3.5rem;
      z-index: 20;
      text-align: center;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 9vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffffff 0%, #fff1a8 25%, #ffd700 50%, #d49000 75%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.6));
      animation: headerGlow 3.5s ease-in-out infinite alternate;
    }
    @keyframes headerGlow {
      0% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4)); }
      100% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.9)); }
    }

    /* Central Mining Viewport */
    .viewport {
      position: relative;
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    /* Continuous Mining Rail Tracks */
    .track-wrapper {
      position: absolute;
      bottom: 60px;
      width: 200%;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        #523c1b 0px,
        #523c1b 16px,
        transparent 16px,
        transparent 45px
      );
      border-top: 4px solid #b8860b;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      animation: moveTracks 1.8s linear infinite;
    }
    @keyframes moveTracks {
      0% { transform: translateX(0); }
      100% { transform: translateX(-45px); }
    }

    /* Heavy-Duty Moving Mining Vehicle */
    .mining-cart {
      position: relative;
      width: 260px;
      height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cartRumble 0.18s infinite alternate ease-in-out;
    }
    @keyframes cartRumble {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-3px) rotate(0.4deg); }
    }

    /* Vehicle Body (Heavy Reinforced Steel / Dark Brass) */
    .cart-hull {
      position: relative;
      width: 220px;
      height: 105px;
      background: linear-gradient(180deg, #382c16 0%, #1e180d 70%, #120e06 100%);
      border: 3px solid #856427;
      border-radius: 6px 6px 18px 18px;
      clip-path: polygon(0% 0%, 100% 0%, 88% 100%, 12% 100%);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hull-plate {
      position: absolute;
      width: 80%;
      height: 40px;
      border: 2px solid #574116;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hull-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
    }

    /* Front Industrial Headlight */
    .headlight {
      position: absolute;
      right: 8px;
      bottom: 25px;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 20px 8px #fff6b8;
      z-index: 10;
    }
    .light-beam {
      position: absolute;
      left: 14px;
      top: -45px;
      width: 280px;
      height: 110px;
      background: linear-gradient(90deg, rgba(255, 240, 160, 0.45) 0%, rgba(255, 230, 100, 0.08) 70%, transparent 100%);
      clip-path: polygon(0% 45%, 100% 0%, 100% 100%, 0% 55%);
      pointer-events: none;
    }

    /* Cart Cargo: Overflowing Glowing Gold & Diamonds */
    .cargo-hold {
      position: absolute;
      top: -38px;
      width: 200px;
      height: 60px;
      z-index: 5;
    }

    /* Sparkling Multi-Faceted Diamonds */
    .diamond {
      position: absolute;
      background: linear-gradient(135deg, #ffffff 0%, #bdf2ff 45%, #60c5ff 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: 0 0 25px #8adcff;
      filter: drop-shadow(0 0 12px rgba(160, 230, 255, 0.95));
      animation: diamondGlint 1.8s infinite ease-in-out alternate;
    }
    @keyframes diamondGlint {
      0% { transform: scale(0.9) rotate(0deg); filter: drop-shadow(0 0 10px #7ad1ff); opacity: 0.85; }
      100% { transform: scale(1.15) rotate(15deg); filter: drop-shadow(0 0 25px #ffffff); opacity: 1; }
    }
    .d1 { width: 34px; height: 34px; left: 25px; top: 8px; animation-delay: 0.1s; }
    .d2 { width: 42px; height: 42px; left: 85px; top: -14px; animation-delay: 0.6s; z-index: 3; }
    .d3 { width: 28px; height: 28px; right: 30px; top: 12px; animation-delay: 1.1s; }

    /* Glowing Raw Gold Nuggets */
    .nugget {
      position: absolute;
      background: radial-gradient(circle at 35% 30%, #fff7b8 0%, #ffd700 45%, #b57c00 80%, #573a00 100%);
      border-radius: 40% 60% 65% 35% / 45% 55% 45% 55%;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.85), inset 0 0 10px rgba(255, 255, 255, 0.6);
      animation: goldRadiance 2.2s infinite ease-in-out alternate;
    }
    @keyframes goldRadiance {
      0% { filter: brightness(1) drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
      100% { filter: brightness(1.35) drop-shadow(0 0 35px rgba(255, 235, 120, 1)); }
    }
    .g1 { width: 55px; height: 44px; left: -2px; top: 2px; }
    .g2 { width: 62px; height: 48px; left: 52px; top: -18px; z-index: 2; }
    .g3 { width: 58px; height: 44px; right: 6px; top: 6px; }
    .g4 { width: 40px; height: 32px; left: 130px; top: 10px; z-index: 4; }

    /* Industrial Heavy Wheels */
    .wheel-assembly {
      position: absolute;
      bottom: 22px;
      width: 190px;
      display: flex;
      justify-content: space-between;
      z-index: 8;
    }
    .wheel {
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #5e471d 25%, #291d09 60%, #110c02 90%);
      border: 4px dashed #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.95);
      animation: spinWheel 0.7s linear infinite;
    }
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Minimal Visitor Counter Footer */
    footer {
      padding-bottom: 3.5rem;
      z-index: 20;
    }
    .counter-capsule {
      background: rgba(18, 14, 5, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.4);
      backdrop-filter: blur(14px);
      padding: 0.55rem 1.6rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.2);
    }
    .counter-dot {
      width: 8px;
      height: 8px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd700;
      animation: blink 1.5s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .counter-value {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="mine-fx"></canvas>

  <header>
    <div class="brand-title">24krt.com</div>
  </header>

  <div class="viewport">
    <!-- Moving Track Ties -->
    <div class="track-wrapper"></div>

    <!-- Active Mining Vehicle Carrying Treasure -->
    <div class="mining-cart">
      <div class="cargo-hold">
        <!-- Shining Gold Nuggets -->
        <div class="nugget g1"></div>
        <div class="nugget g2"></div>
        <div class="nugget g3"></div>
        <div class="nugget g4"></div>

        <!-- Radiant High-Refraction Diamonds -->
        <div class="diamond d1"></div>
        <div class="diamond d2"></div>
        <div class="diamond d3"></div>
      </div>

      <!-- Vehicle Chasis -->
      <div class="cart-hull">
        <div class="hull-plate">
          <span class="hull-badge">24K PURE</span>
        </div>
        <div class="headlight">
          <div class="light-beam"></div>
        </div>
      </div>

      <!-- Spinning Tracks Wheels -->
      <div class="wheel-assembly">
        <div class="wheel"></div>
        <div class="wheel"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="counter-capsule">
      <div class="counter-dot"></div>
      <span class="counter-value" id="visit-num">...</span>
    </div>
  </footer>

  <script>
    // Live Persistent Visitor Counter
    (function () {
      const el = document.getElementById('visit-num');
      let count = 1860;
      try {
        const key = '24krt_mine_v3';
        const saved = localStorage.getItem(key);
        if (saved) {
          count = parseInt(saved, 10) + 1;
        } else {
          count += Math.floor(Math.random() * 30);
        }
        localStorage.setItem(key, count);
      } catch (err) {
        count = 1890;
      }
      el.textContent = count.toLocaleString();
    })();

    // Cavern Gold Dust & Diamond Sparkle Particles
    const canvas = document.getElementById('mine-fx');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2.5 + 0.6,
      vx: -(Math.random() * 1.8 + 0.8), // drifting backward as the vehicle drives forward
      vy: Math.random() * 0.5 - 0.25,
      alpha: Math.random() * 0.8 + 0.2,
      isDiamond: Math.random() > 0.65
    }));

    function loop() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -10) {
          p.x = w + 10;
          p.y = Math.random() * h;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

        if (p.isDiamond) {
          ctx.fillStyle = `rgba(190, 235, 255, ${p.alpha})`;
          ctx.shadowColor = '#8cd9ff';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 10;
        }
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
