<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24krt.com</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }

    /* Shimmering Animated 24krt.com Text */
    .domain-title {
      font-size: clamp(42px, 10vw, 84px);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(
        110deg,
        #c69214 0%,
        #ffd700 25%,
        #fff9d2 50%,
        #ffd700 75%,
        #c69214 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShine 3s linear infinite;
      margin-bottom: 24px;
    }

    /* Visitor Counter Card */
    .counter-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 215, 0, 0.06);
      border: 1px solid rgba(255, 215, 0, 0.25);
      padding: 10px 20px;
      border-radius: 30px;
      color: #ffd700;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
    }

    .counter-box img {
      display: block;
      height: 22px;
      border-radius: 4px;
    }

    @keyframes goldShine {
      to {
        background-position: 200% center;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Domain -->
  <h1 class="domain-title">24krt.com</h1>

  <!-- Visitor Count -->
  <div class="counter-box">
    <span>👁️ Views</span>
    <img src="https://countapi.mileshilliard.com/api/v1/hit/24krt_official_visitors/shield?text=&bgcolor=ffd700&textcolor=000000" alt="Visitor Count">
  </div>

</body>
</html>
