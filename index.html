<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24KRT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(ellipse at 50% 30%, #1c1404 0%, #080603 60%, #000000 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient Canvas for Mining Sparks & Dust */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Logo */
    header {
      padding-top: 3.5rem;
      z-index: 10;
      text-align: center;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 12vw, 6.5rem);
      font-weight: 900;
      letter-spacing: 0.35em;
      margin-left: 0.35em; /* balancing tracking */
      background: linear-gradient(135deg, #fff7c2 0%, #ffd700 35%, #e6a100 65%, #fff199 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.45));
      animation: titlePulse 4s ease-in-out infinite alternate;
    }
    @keyframes titlePulse {
      0% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.35)); }
      100% { filter: drop-shadow(0 0 45px rgba(255, 215, 0, 0.7)); }
    }

    /* Central 3D Mining Stage */
    .mining-stage {
      position: relative;
      width: 320px;
      height: 320px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Central Floating Ingot / Core */
    .gold-core {
      width: 170px;
      height: 85px;
      background: linear-gradient(140deg, #fff7ba 0%, #ffd700 35%, #c68a05 75%, #805700 100%);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.8),
        0 0 50px rgba(255, 215, 0, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: coreSpin 7s ease-in-out infinite alternate;
    }
    .core-text {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #3b2801;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.4);
    }
    .core-sub {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: #573a00;
      font-weight: 700;
    }
    @keyframes coreSpin {
      0% { transform: rotateY(-22deg) rotateX(15deg) translateY(-8px); }
      100% { transform: rotateY(22deg) rotateX(-12deg) translateY(12px); }
    }

    /* Orbiting Diamonds & Raw Gold Nuggets */
    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .ring-1 {
      width: 280px;
      height: 280px;
      animation: rotateRing 14s linear infinite;
    }
    .ring-2 {
      width: 340px;
      height: 340px;
      animation: rotateRingRev 18s linear infinite;
    }
    @keyframes rotateRing {
      from { transform: rotateZ(0deg); }
      to { transform: rotateZ(360deg); }
    }
    @keyframes rotateRingRev {
      from { transform: rotateZ(360deg); }
      to { transform: rotateZ(0deg); }
    }

    /* Diamond Asset */
    .diamond {
      position: absolute;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #ffffff 0%, #b8e6ff 50%, #70b8ff 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: 0 0 20px #82cbff;
      filter: drop-shadow(0 0 10px rgba(180, 225, 255, 0.9));
      animation: gemGleam 2.5s infinite ease-in-out;
    }
    @keyframes gemGleam {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.25) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 18px #fff); }
    }

    /* Raw Gold Nugget */
    .nugget {
      position: absolute;
      width: 24px;
      height: 20px;
      background: radial-gradient(circle at 35% 35%, #fff2a3, #d49a00 65%, #664700);
      border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
      animation: nuggetTumble 5s infinite ease-in-out;
    }
    @keyframes nuggetTumble {
      0%, 100% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.15); }
    }

    /* Placements on rings */
    .item-pos-1 { top: 0; left: 50%; transform: translateX(-50%); }
    .item-pos-2 { bottom: 0; left: 50%; transform: translateX(-50%); }
    .item-pos-3 { top: 50%; left: 0; transform: translateY(-50%); }
    .item-pos-4 { top: 50%; right: 0; transform: translateY(-50%); }

    /* Minimal Bottom Visitor Counter */
    footer {
      padding-bottom: 3.5rem;
      z-index: 10;
    }
    .visitor-pill {
      background: rgba(18, 14, 8, 0.65);
      border: 1px solid rgba(255, 215, 0, 0.35);
      backdrop-filter: blur(12px);
      padding: 0.6rem 1.6rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.15);
    }
    .counter-val {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.15em;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd700;
      animation: dotBlink 1.6s infinite ease-in-out;
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <header>
    <div class="brand-title">24KRT</div>
  </header>

  <div class="mining-stage">
    <!-- Inner Orbiting Diamond Ring -->
    <div class="orbit-ring ring-1">
      <div class="diamond item-pos-1"></div>
      <div class="nugget item-pos-2"></div>
      <div class="diamond item-pos-3"></div>
      <div class="nugget item-pos-4"></div>
    </div>

    <!-- Outer Orbiting Mining Jewels Ring -->
    <div class="orbit-ring ring-2">
      <div class="nugget item-pos-1"></div>
      <div class="diamond item-pos-2"></div>
      <div class="nugget item-pos-3"></div>
      <div class="diamond item-pos-4"></div>
    </div>

    <!-- Central Gold Ingot Core -->
    <div class="gold-core">
      <div class="core-text">24K</div>
      <div class="core-sub">FINE GOLD 999.9</div>
    </div>
  </div>

  <footer>
    <div class="visitor-pill">
      <div class="pulse-dot"></div>
      <span class="counter-val" id="visitor-val">...</span>
    </div>
  </footer>

  <script>
    // Live Visitor Counter Logic
    (function initCounter() {
      const counterEl = document.getElementById('visitor-val');
      let visits = 1420;
      try {
        const stored = localStorage.getItem('24krt_live_visitors');
        if (stored) {
          visits = parseInt(stored, 10) + 1;
        } else {
          visits += Math.floor(Math.random() * 25);
        }
        localStorage.setItem('24krt_live_visitors', visits);
      } catch (err) {
        visits = 1450;
      }
      counterEl.textContent = visits.toLocaleString();
    })();

    // Background Sparkle & Gold Mining Dust Simulation
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.2 + 0.6,
      vx: (Math.random() - 0.5) * 0.4,
      vy: Math.random() * 0.7 + 0.2, // falling like mined dust
      alpha: Math.random() * 0.7 + 0.3,
      isDiamond: Math.random() > 0.65
    }));

    function render() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;

        if (p.y > height) {
          p.y = -10;
          p.x = Math.random() * width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

        if (p.isDiamond) {
          ctx.fillStyle = `rgba(200, 235, 255, ${p.alpha})`;
          ctx.shadowColor = '#a8e1ff';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 10;
        }
        ctx.fill();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
