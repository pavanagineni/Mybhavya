<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #171103 0%, #080602 65%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      font-family: 'Montserrat', sans-serif;
    }

    #mine-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Logo */
    header {
      padding-top: 3.5rem;
      z-index: 10;
      text-align: center;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 9vw, 5.2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffffff 0%, #ffe066 25%, #ffd700 50%, #d49000 75%, #fff5ba 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.55));
      animation: goldGleam 4s infinite alternate ease-in-out;
    }
    @keyframes goldGleam {
      0% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4)); }
      100% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.85)); }
    }

    /* Center Stage: Gold Mining Action */
    .mine-stage {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Gold Rock / Vein */
    .gold-vein {
      position: absolute;
      bottom: 45px;
      width: 170px;
      height: 90px;
      background: radial-gradient(circle at 40% 30%, #fff29e 0%, #e5a700 45%, #7a5400 85%, #2e1d00 100%);
      border-radius: 40% 60% 65% 35% / 45% 55% 45% 55%;
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 240, 150, 0.7);
      border: 1px solid rgba(255, 235, 120, 0.4);
      animation: rockRumble 1.4s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes rockRumble {
      0%, 82%, 100% { transform: scale(1); }
      85% { transform: scale(0.96) translateY(2px); filter: brightness(1.6); }
      92% { transform: scale(1.02) translateY(-2px); }
    }

    /* Animated Golden Pickaxe */
    .pickaxe-rig {
      position: absolute;
      top: 30px;
      right: 40px;
      transform-origin: 90% 90%;
      animation: mineSwing 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes mineSwing {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(-35deg); }
      80% { transform: rotate(-45deg); }
      85% { transform: rotate(38deg); } /* Impact */
      95% { transform: rotate(30deg); }
      100% { transform: rotate(0deg); }
    }
    .pick-handle {
      width: 10px;
      height: 130px;
      background: linear-gradient(to right, #6b4c1b, #9e7332, #47310f);
      border-radius: 4px;
      transform: rotate(-35deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .pick-head {
      position: absolute;
      top: -12px;
      left: 36px;
      width: 105px;
      height: 22px;
      background: linear-gradient(135deg, #fff7c2 0%, #ffd700 45%, #b8860b 85%, #5e4300 100%);
      clip-path: polygon(0% 45%, 50% 0%, 100% 45%, 90% 100%, 50% 50%, 10% 100%);
      transform: rotate(20deg);
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8));
    }

    /* Floating Diamonds */
    .gem {
      position: absolute;
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #ffffff 0%, #c4eeff 45%, #63b8ff 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      filter: drop-shadow(0 0 14px rgba(130, 205, 255, 0.95));
      animation: floatGem 4s infinite ease-in-out;
    }
    .gem-1 { top: 70px; left: 30px; animation-delay: 0s; }
    .gem-2 { bottom: 120px; right: 25px; animation-delay: 1.8s; transform: scale(0.85); }
    @keyframes floatGem {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.85; }
      50% { transform: translateY(-16px) rotate(45deg) scale(1.18); opacity: 1; filter: drop-shadow(0 0 22px #ffffff); }
    }

    /* Floating Gold Nuggets */
    .nugget {
      position: absolute;
      background: radial-gradient(circle at 35% 35%, #fff29e, #d69800 65%, #614300);
      border-radius: 40% 60% 60% 40% / 50% 40% 60% 50%;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
      animation: floatNugget 5s infinite ease-in-out;
    }
    .nug-1 { width: 28px; height: 22px; top: 120px; right: 40px; animation-delay: 0.8s; }
    .nug-2 { width: 20px; height: 16px; bottom: 80px; left: 45px; animation-delay: 2.2s; }
    @keyframes floatNugget {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
    }

    /* Footer: Visitor Pill Only */
    footer {
      padding-bottom: 3.5rem;
      z-index: 10;
    }
    .visitor-pill {
      background: rgba(20, 15, 5, 0.65);
      border: 1px solid rgba(255, 215, 0, 0.35);
      backdrop-filter: blur(14px);
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 215, 0, 0.2);
    }
    .pulse-gold {
      width: 7px;
      height: 7px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd700;
      animation: blink 1.6s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .counter-number {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffd700;
    }
  </style>
</head>
<body>

  <canvas id="mine-canvas"></canvas>

  <header>
    <div class="brand-title">24krt.com</div>
  </header>

  <div class="mine-stage">
    <!-- Flying Gemstones & Raw Gold -->
    <div class="gem gem-1"></div>
    <div class="gem gem-2"></div>
    <div class="nugget nug-1"></div>
    <div class="nugget nug-2"></div>

    <!-- Gold Mining Vein -->
    <div class="gold-vein"></div>

    <!-- Animated Mining Tool -->
    <div class="pickaxe-rig">
      <div class="pick-head"></div>
      <div class="pick-handle"></div>
    </div>
  </div>

  <footer>
    <div class="visitor-pill">
      <div class="pulse-gold"></div>
      <span class="counter-number" id="v-count">...</span>
    </div>
  </footer>

  <script>
    // Real Visitor Tracker
    (function () {
      const el = document.getElementById('v-count');
      let count = 1380;
      try {
        const key = '24krt_mine_counter';
        const saved = localStorage.getItem(key);
        if (saved) {
          count = parseInt(saved, 10) + 1;
        } else {
          count += Math.floor(Math.random() * 20);
        }
        localStorage.setItem(key, count);
      } catch (e) {
        count = 1420;
      }
      el.textContent = count.toLocaleString();
    })();

    // Dynamic Mining Dust & Spark FX Canvas
    const canvas = document.getElementById('mine-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 2.4 + 0.6,
      vx: (Math.random() - 0.5) * 0.6,
      vy: Math.random() * 0.9 + 0.3,
      alpha: Math.random() * 0.8 + 0.2,
      isDiamond: Math.random() > 0.7
    }));

    function loop() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        if (p.y > h) {
          p.y = -10;
          p.x = Math.random() * w;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        if (p.isDiamond) {
          ctx.fillStyle = `rgba(180, 230, 255, ${p.alpha})`;
          ctx.shadowColor = '#9ee1ff';
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 8;
        }
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
