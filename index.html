<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080602;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      font-family: 'Outfit', sans-serif;
    }

    /* Hardware-accelerated Canvas for Mining Effects */
    #miner-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Top Branding */
    header {
      padding-top: max(2.5rem, env(safe-area-inset-top));
      z-index: 20;
      text-align: center;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 10vw, 5.2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffffff 0%, #fff1a8 20%, #ffd700 50%, #d49000 80%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineSweep 4s linear infinite;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.55));
    }
    @keyframes shineSweep {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Central Mining Stage (Responsive scale) */
    .mining-stage {
      position: relative;
      width: min(92vw, 420px);
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Shaft Depth Ambient Light */
    .mine-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.18) 0%, rgba(212, 144, 0, 0.05) 50%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      animation: ambientPulse 3s ease-in-out infinite alternate;
    }
    @keyframes ambientPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Idle Miner Pickaxe Action */
    .pickaxe-miner {
      position: absolute;
      top: 25px;
      right: 45px;
      width: 90px;
      height: 90px;
      transform-origin: 85% 85%;
      animation: idleStrike 1.1s cubic-bezier(0.6, 0, 0.2, 1) infinite;
      z-index: 15;
    }
    @keyframes idleStrike {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(-55deg); }
      70% { transform: rotate(-65deg); }
      78% { transform: rotate(26deg); } /* Impact */
      85% { transform: rotate(18deg); }
      100% { transform: rotate(0deg); }
    }
    .pick-shaft {
      position: absolute;
      bottom: 10px;
      right: 15px;
      width: 8px;
      height: 75px;
      background: linear-gradient(to right, #8a5823, #543410);
      border-radius: 4px;
      transform: rotate(-35deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    .pick-blade {
      position: absolute;
      top: 6px;
      left: 14px;
      width: 72px;
      height: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 40%, #c68a00 85%, #593d00 100%);
      clip-path: polygon(0% 50%, 50% 0%, 100% 50%, 90% 100%, 50% 60%, 10% 100%);
      transform: rotate(20deg);
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
    }

    /* Gold Rock Vein Being Mined */
    .gold-vein {
      position: absolute;
      top: 90px;
      right: 25px;
      width: 100px;
      height: 75px;
      background: radial-gradient(circle at 40% 30%, #fff7a1 0%, #e6a100 45%, #6e4a00 80%, #291b00 100%);
      border-radius: 35% 65% 55% 45% / 45% 40% 60% 55%;
      border: 2px solid rgba(255, 235, 120, 0.5);
      box-shadow: inset 0 0 15px #ffd700, 0 0 30px rgba(255, 215, 0, 0.4);
      animation: rockImpact 1.1s cubic-bezier(0.6, 0, 0.2, 1) infinite;
      z-index: 12;
    }
    @keyframes rockImpact {
      0%, 75%, 100% { transform: scale(1); filter: brightness(1); }
      78% { transform: scale(0.94); filter: brightness(1.7) drop-shadow(0 0 25px #ffd700); }
      85% { transform: scale(1.02); }
    }

    /* Idle Tycoon Floating +24K Reward Token */
    .float-reward {
      position: absolute;
      top: 60px;
      right: 70px;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff285;
      text-shadow: 0 0 12px #ffd700, 0 0 20px #e6a100;
      animation: floatGain 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) infinite;
      z-index: 25;
      pointer-events: none;
    }
    @keyframes floatGain {
      0%, 76% { opacity: 0; transform: translateY(0) scale(0.6); }
      78% { opacity: 1; transform: translateY(-5px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-45px) scale(0.9); }
    }

    /* Mining Rail Tracks */
    .rail-system {
      position: absolute;
      bottom: 25px;
      width: 100%;
      height: 14px;
      background: repeating-linear-gradient(
        90deg,
        #4a3415 0px,
        #4a3415 14px,
        transparent 14px,
        transparent 38px
      );
      border-top: 3px solid #b8860b;
      box-shadow: 0 6px 15px rgba(0,0,0,0.9);
      animation: trackRun 1.2s linear infinite;
    }
    @keyframes trackRun {
      0% { transform: translateX(0); }
      100% { transform: translateX(-38px); }
    }

    /* Smooth Mining Cart Vehicle */
    .mine-cart {
      position: absolute;
      bottom: 35px;
      left: 30px;
      width: 210px;
      height: 140px;
      z-index: 14;
      animation: cartChug 0.22s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes cartChug {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-3px) rotate(0.4deg); }
    }

    /* Cart Body */
    .cart-body {
      position: absolute;
      bottom: 20px;
      width: 100%;
      height: 75px;
      background: linear-gradient(180deg, #3d2c12 0%, #1c1407 80%, #0e0902 100%);
      border: 3px solid #b38827;
      border-radius: 4px 4px 16px 16px;
      clip-path: polygon(0% 0%, 100% 0%, 88% 100%, 12% 100%);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-emblem {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
    }

    /* Cart Headlight */
    .front-lantern {
      position: absolute;
      right: 4px;
      bottom: 40px;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 18px 6px #fff4a3;
      z-index: 16;
    }
    .light-cone {
      position: absolute;
      left: 12px;
      top: -35px;
      width: 160px;
      height: 85px;
      background: linear-gradient(90deg, rgba(255, 240, 160, 0.4) 0%, rgba(255, 220, 90, 0.05) 75%, transparent 100%);
      clip-path: polygon(0% 45%, 100% 0%, 100% 100%, 0% 55%);
      pointer-events: none;
    }

    /* Cart Cargo: Sparkling Diamonds & Raw Gold Nuggets */
    .cart-loot {
      position: absolute;
      top: 5px;
      width: 100%;
      height: 45px;
      z-index: 13;
    }

    /* Tycoon Diamonds */
    .tycoon-diamond {
      position: absolute;
      background: linear-gradient(135deg, #ffffff 0%, #bde8ff 50%, #61bdff 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      filter: drop-shadow(0 0 12px rgba(130, 205, 255, 0.95));
      animation: diamondShimmer 1.8s infinite ease-in-out alternate;
    }
    @keyframes diamondShimmer {
      0% { transform: scale(0.92) rotate(0deg); opacity: 0.85; filter: drop-shadow(0 0 8px #7ad1ff); }
      100% { transform: scale(1.18) rotate(12deg); opacity: 1; filter: drop-shadow(0 0 20px #ffffff); }
    }
    .dm-1 { width: 30px; height: 30px; left: 35px; top: 0px; }
    .dm-2 { width: 36px; height: 36px; left: 88px; top: -14px; animation-delay: 0.5s; z-index: 2; }
    .dm-3 { width: 26px; height: 26px; right: 40px; top: 4px; animation-delay: 1s; }

    /* Tycoon Gold Nuggets */
    .tycoon-gold {
      position: absolute;
      background: radial-gradient(circle at 35% 30%, #fff7a8 0%, #ffd700 45%, #b57a00 80%, #523700 100%);
      border-radius: 40% 60% 65% 35% / 45% 55% 45% 55%;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.8), inset 0 0 8px #fff;
      animation: goldPulse 2.4s infinite ease-in-out alternate;
    }
    @keyframes goldPulse {
      0% { filter: brightness(1) drop-shadow(0 0 10px rgba(255, 215, 0, 0.6)); }
      100% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 235, 120, 1)); }
    }
    .ng-1 { width: 48px; height: 36px; left: 8px; top: 8px; }
    .ng-2 { width: 52px; height: 40px; left: 58px; top: -6px; z-index: 1; }
    .ng-3 { width: 46px; height: 34px; right: 12px; top: 12px; }

    /* Rolling Wheel Assemblies */
    .cart-wheels {
      position: absolute;
      bottom: 2px;
      width: 100%;
      padding: 0 26px;
      display: flex;
      justify-content: space-between;
      z-index: 16;
    }
    .wheel {
      width: 38px;
      height: 38px;
      background: radial-gradient(circle, #573e16 25%, #211604 70%, #0d0801 100%);
      border: 3px dashed #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.9);
      animation: spinCogs 0.6s linear infinite;
    }
    @keyframes spinCogs {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Minimalist VIP Visitor Pill Footer */
    footer {
      padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
      z-index: 20;
    }
    .visitor-capsule {
      background: rgba(22, 17, 7, 0.65);
      border: 1px solid rgba(255, 215, 0, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 0.6rem 1.6rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.2);
    }
    .gold-dot {
      width: 8px;
      height: 8px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd700;
      animation: dotFlicker 1.5s infinite ease-in-out;
    }
    @keyframes dotFlicker {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .visitor-number {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="miner-canvas"></canvas>

  <header>
    <div class="brand-title">24krt.com</div>
  </header>

  <div class="mining-stage">
    <div class="mine-glow"></div>

    <!-- Automated Miner Strike -->
    <div class="float-reward">+24K</div>
    <div class="pickaxe-miner">
      <div class="pick-blade"></div>
      <div class="pick-shaft"></div>
    </div>
    <div class="gold-vein"></div>

    <!-- Moving Tracks -->
    <div class="rail-system"></div>

    <!-- Mining Vehicle Loaded with Treasure -->
    <div class="mine-cart">
      <div class="cart-loot">
        <div class="tycoon-gold ng-1"></div>
        <div class="tycoon-gold ng-2"></div>
        <div class="tycoon-gold ng-3"></div>
        <div class="tycoon-diamond dm-1"></div>
        <div class="tycoon-diamond dm-2"></div>
        <div class="tycoon-diamond dm-3"></div>
      </div>
      <div class="cart-body">
        <span class="cart-emblem">24K MINE</span>
        <div class="front-lantern">
          <div class="light-cone"></div>
        </div>
      </div>
      <div class="cart-wheels">
        <div class="wheel"></div>
        <div class="wheel"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="visitor-capsule">
      <div class="gold-dot"></div>
      <span class="visitor-number" id="v-num">...</span>
    </div>
  </footer>

  <script>
    // Persistent Live Visitor Counter
    (function () {
      const el = document.getElementById('v-num');
      let count = 2140;
      try {
        const key = '24krt_tycoon_visitors';
        const saved = localStorage.getItem(key);
        if (saved) {
          count = parseInt(saved, 10) + 1;
        } else {
          count += Math.floor(Math.random() * 25);
        }
        localStorage.setItem(key, count);
      } catch (e) {
        count = 2185;
      }
      el.textContent = count.toLocaleString();
    })();

    // 60FPS Hardware-Accelerated Ambient Mining Sparks & Diamond Dust
    const canvas = document.getElementById('miner-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const particles = Array.from({ length: 50 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.2 + 0.6,
      vx: (Math.random() - 0.5) * 0.5,
      vy: Math.random() * 0.8 + 0.3,
      alpha: Math.random() * 0.7 + 0.3,
      isGem: Math.random() > 0.65
    }));

    function frame() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.y += p.vy;
        p.x += p.vx;

        if (p.y > height) {
          p.y = -10;
          p.x = Math.random() * width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        if (p.isGem) {
          ctx.fillStyle = `rgba(180, 235, 255, ${p.alpha})`;
          ctx.shadowColor = '#80d4ff';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 6;
        }
        ctx.fill();
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
