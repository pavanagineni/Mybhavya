<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24krt.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #171103 0%, #080602 65%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      font-family: 'Montserrat', sans-serif;
    }

    #mine-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Logo */
    header {
      padding-top: 3.5rem;
      z-index: 10;
      text-align: center;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 9vw, 5.2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffffff 0%, #ffe066 25%, #ffd700 50%, #d49000 75%, #fff5ba 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.55));
      animation: goldGleam 4s infinite alternate ease-in-out;
    }
    @keyframes goldGleam {
      0% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4)); }
      100% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.85)); }
    }
