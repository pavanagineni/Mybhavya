<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday • October 3 | 24krt.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(ellipse at bottom, #1c1505 0%, #0c0a06 50%, #030303 100%);
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .font-luxury {
      font-family: 'Cinzel', serif;
    }

    /* Shimmering Gold Text */
    .gold-shimmer-text {
      background: linear-gradient(135deg, 
        #d4af37 0%, 
        #fff4cc 25%, 
        #ffd700 50%, 
        #c59b27 75%, 
        #fff9e6 100%
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldSheen 4s linear infinite;
    }

    @keyframes goldSheen {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Balloons & Sparkles */
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .balloon-float-1 { animation: floatGentle 4s ease-in-out infinite; }
    .balloon-float-2 { animation: floatGentle 4.8s ease-in-out infinite 0.7s; }
    .balloon-float-3 { animation: floatGentle 4.3s ease-in-out infinite 1.4s; }

    /* Character idle breathing and blinking */
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .character-idle {
      animation: breathe 3s ease-in-out infinite;
    }

    /* Gift Wobble Animation */
    @keyframes giftWobble {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.08) rotate(-4deg); }
      40% { transform: scale(1.08) rotate(4deg); }
      60% { transform: scale(1.1) rotate(-3deg); }
      80% { transform: scale(1.05) rotate(2deg); }
    }

    .wobble-gift {
      animation: giftWobble 0.9s infinite ease-in-out;
    }

    /* Pulsing Glow */
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.2);
      }
      50% {
        box-shadow: 0 0 45px rgba(255, 215, 0, 0.65), inset 0 0 25px rgba(255, 215, 0, 0.4);
      }
    }

    .glow-aura {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* Golden Halo Rays */
    @keyframes rotateRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .halo-rays {
      animation: rotateRays 25s linear infinite;
    }

    /* Gift Lid Pop Off */
    .lid-popped {
      transform: translateY(-90px) rotate(-18deg) scale(0.9);
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>

<body class="text-amber-50 flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 relative select-none">
  
  <!-- Subtle Golden Light Aura Background -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0">

    <div id="haloBackdrop" class="absolute w-[600px] h-[600px] sm:w-[900px] sm:h-[900px] opacity-0 transition-opacity duration-1000 halo-rays pointer-events-none" style="background: radial-gradient(circle, rgba(255,215,0,0.18) 0%, rgba(212,175,55,0.05) 45%, transparent 70%);"></div>
  </div>

      <div id="giftBoxContainer" class="absolute right-3 sm:right-6 bottom-4 z-20 cursor-pointer flex flex-col items-center group" onclick="openGiftBox()">

    <div id="revealTarget" class="w-full max-w-md opacity-0 scale-75 pointer-events-none transition-all duration-1000 transform mt-3 flex flex-col items-center">
      
      <!-- Premium Glass Gold Card -->
      <div class="w-full bg-gradient-to-b from-amber-500/15 via-black/80 to-amber-950/30 border-2 border-amber-400/50 rounded-3xl p-6 sm:p-7 shadow-[0_0_50px_rgba(245,158,11,0.25)] backdrop-blur-xl relative overflow-hidden">
        
        <!-- Glowing Ambient Lines -->

        <div class="absolute -bottom-10 -left-10 w-36 h-36 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="inline-flex items-center gap-2 text-xs font-black tracking-widest text-amber-300 uppercase px-3.5 py-1 rounded-full bg-amber-400/10 border border-amber-400/30 mb-3">
          <span>👑</span> Official Domain Reveal <span>👑</span>
        </div>

        <!-- 24krt.com Majestic Title -->
        <h1 class="text-4xl sm:text-5xl font-black font-luxury gold-shimmer-text tracking-wider filter drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)] py-1">
          24krt.com

        <!-- Under Construction Subtitle -->

    <div class="flex items-center gap-2">

      <span>24krt.com</span>
    </div>
  </footer>

  <!-- Hidden sound synthesizers and scripts -->
  <script>
    let audioReady = false;
    let soundEnabled = true;
    let chimeSynth = null;
    let fanfareSynth = null;

    function initAudio() {
      if (audioReady) return;
      try {
        Tone.start();
        // Soft celebratory bell chime
        chimeSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle8" },
          envelope: { attack: 0.02, decay: 1.2, sustain: 0.1, release: 1.5 }
        }).toDestination();
        chimeSynth.volume.value = -6;

        // Triumphant Fanfare Synth
        fanfareSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "fatsawtooth", count: 3, spread: 20 },
          envelope: { attack: 0.04, decay: 0.8, sustain: 0.2, release: 1.2 }
        }).toDestination();
        fanfareSynth.volume.value = -8;

        audioReady = true;
      } catch (e) {
        console.warn("Audio initialization postponed:", e);
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundText');
      if (soundEnabled) {
        icon.textContent = '🔊';
        text.textContent = 'Sound ON';
        initAudio();
      } else {
        icon.textContent = '🔇';
        text.textContent = 'Muted';
      }
    }

    function playGiftOpenSound() {
      if (!soundEnabled || !audioReady) return;
      try {
        const now = Tone.now();
        // Play sparkly ascending arpeggio notes
        chimeSynth.triggerAttackRelease(["C5", "E5"], "16n", now);
        chimeSynth.triggerAttackRelease(["G5", "B5"], "16n", now + 0.12);
        chimeSynth.triggerAttackRelease(["C6", "E6", "G6"], "8n", now + 0.25);

        // Grand final chord
        fanfareSynth.triggerAttackRelease(["C4", "G4", "C5", "E5"], "2n", now + 0.45);
      } catch (e) {
        console.warn(e);
      }
    }

    let giftOpened = false;

    function triggerConfettiBurst() {
      // Side confetti cannons
      confetti({
        particleCount: 70,
        spread: 80,
        origin: { y: 0.65, x: 0.7 },
        colors: ['#ffd700', '#f59e0b', '#a855f7', '#ec4899', '#ffffff']
      });

      confetti({
        particleCount: 50,
        spread: 70,
        origin: { y: 0.6, x: 0.3 },
        colors: ['#ffd700', '#ffffff', '#c084fc']
      });

      // Gold Sparkle star shower
      setTimeout(() => {
        confetti({
          particleCount: 90,
          spread: 100,
          startVelocity: 45,
          origin: { y: 0.5, x: 0.5 },
          shapes: ['circle'],
          colors: ['#ffd700', '#fff9e6', '#d4af37']
        });
      }, 350);
    }

    function openGiftBox() {
      if (giftOpened) return;
      giftOpened = true;

      // Start audio if first touch
      initAudio();
      playGiftOpenSound();

      // UI Elements
      const giftLid = document.getElementById('giftLid');
      const giftBoxWrapper = document.getElementById('giftBoxWrapper');
      const tapPrompt = document.getElementById('tapPrompt');
      const instructionText = document.getElementById('instructionText');
      const revealTarget = document.getElementById('revealTarget');
      const haloBackdrop = document.getElementById('haloBackdrop');
      const giftBoxContainer = document.getElementById('giftBoxContainer');

      // 1. Remove wobbling and animate lid shooting up
      giftBoxWrapper.classList.remove('wobble-gift');
      giftLid.classList.add('lid-popped');
      tapPrompt.style.opacity = '0';
      instructionText.textContent = '✨ Surprise Unlocked! Happy Birthday Dr. Bhavya! ✨';
      instructionText.classList.add('text-amber-300', 'font-bold');

      // 2. Confetti explosion
      triggerConfettiBurst();

      // 3. Reveal 24krt.com smoothly
      setTimeout(() => {
        // Expand rays
        haloBackdrop.classList.remove('opacity-0');
        haloBackdrop.classList.add('opacity-100');

        // Reveal card
        revealTarget.classList.remove('opacity-0', 'scale-75', 'pointer-events-none');
        revealTarget.classList.add('opacity-100', 'scale-100');

        // Gently reduce gift box size to focus on 24krt.com
        giftBoxContainer.style.transition = 'all 1s ease-in-out';
        giftBoxContainer.style.transform = 'scale(0.85)';
      }, 400);
    }

    // Auto-countdown trigger: if user doesn't tap within 3.5s, unlock automatically
    window.addEventListener('load', () => {
      const autoTimer = setTimeout(() => {
        if (!giftOpened) {
          openGiftBox();
        }
      }, 3500);

      // Clean up timer if clicked before
      document.body.addEventListener('click', () => clearTimeout(autoTimer), { once: true });
      document.body.addEventListener('touchstart', () => clearTimeout(autoTimer), { once: true });
    });
  </script>
</body>
</html>
