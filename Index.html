<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24KRT — Pure Luxury & Bullion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #ffd700;
      --gold-dark: #b8860b;
      --gold-light: #fff3a8;
      --bg-dark: #0a0805;
      --card-bg: rgba(22, 18, 12, 0.75);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #20170a 0%, var(--bg-dark) 85%);
      color: #f7f3e8;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    header {
      width: 100%;
      padding: 2rem 1.5rem;
      text-align: center;
      z-index: 2;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.35em;
      background: linear-gradient(135deg, #fff2a3 0%, #ffd700 45%, #b8860b 80%, #fff7cc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
      text-transform: uppercase;
      margin-left: 0.35em;
    }
    .brand-subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.4em;
      color: #dfcaa2;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }
    main {
      width: 100%;
      max-width: 900px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      gap: 2.5rem;
    }
    .ingot-container {
      perspective: 1200px;
      margin: 1.5rem 0;
    }
    .ingot {
      width: 250px;
      height: 120px;
      background: linear-gradient(145deg, #fff3a8 0%, #ffd700 35%, #b8860b 70%, #8c6708 100%);
      border-radius: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transform-style: preserve-3d;
      animation: floatIngot 6s ease-in-out infinite alternate;
    }
    @keyframes floatIngot {
      0% { transform: rotateY(-18deg) rotateX(12deg) translateY(0); }
      100% { transform: rotateY(18deg) rotateX(-8deg) translateY(-14px); }
    }
    .ingot-stamp {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #4b3603;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.4);
    }
    .ingot-sub {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: #634704;
      font-weight: 600;
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 215, 0, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .card h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      margin-bottom: 0.75rem;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
    }
    .card p {
      color: #d1c8b8;
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 1.5rem;
    }
    .counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: var(--gold-light);
    }
    .counter-number {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-primary);
    }
    footer {
      width: 100%;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #7d7261;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas class="sparkle-canvas" id="canvas"></canvas>

  <header>
    <div class="brand-title">24KRT</div>
    <div class="brand-subtitle">Fine Bullion & High Jewelry</div>
  </header>

  <main>
    <div class="ingot-container">
      <div class="ingot">
        <div class="ingot-stamp">24KRT</div>
        <div class="ingot-sub">999.9 PURE GOLD • 1000g</div>
      </div>
    </div>

    <div class="card">
      <h2>The Digital Vault Is Awakening</h2>
      <p>An exclusive showcase curated for collectors, fine jewelry connoisseurs, and bullion investors. Launching globally.</p>
      <div class="counter-badge">
        <span>VIP VISITS</span>
        <span class="counter-number" id="visitor-count">1,024</span>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 24KRT.COM • ALL RIGHTS RESERVED
  </footer>

  <script>
    const countEl = document.getElementById('visitor-count');
    let base = 1240;
    try {
      const stored = localStorage.getItem('24krt_visits');
      if (stored) {
        base = parseInt(stored, 10) + 1;
      } else {
        base += Math.floor(Math.random() * 20);
      }
      localStorage.setItem('24krt_visits', base);
      countEl.textContent = base.toLocaleString();
    } catch(e) {
      countEl.textContent = '1,248';
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 2.2 + 0.5,
      speedY: Math.random() * 0.4 + 0.1,
      alpha: Math.random() * 0.7 + 0.3,
      glow: Math.random() * 10 + 4
    }));

    function animate() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = h;
          p.x = Math.random() * w;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = p.glow;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
